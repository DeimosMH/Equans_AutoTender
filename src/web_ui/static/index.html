<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tendif</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128194;</text></svg>">
<style>
  :root { --accent:#d9480f; --line:#e2e5ea; --muted:#6b7280; --bg:#f4f5f7;
          --ink:#1f2328; --panel:#fff; --input-bg:#fff; --hover:#f7f8fa;
          --active-bg:#fdf1eb; --badge-bg:#eef1f5; --badge-warn-bg:#fff4e5;
          --badge-warn-ink:#9a3412; --dot:#c4c9d2; --del-ink:#a32323;
          --del-bg:#fdeaea; --dirty-bg:#fffbea; --ok:#2f6b3a; --err:#a32323;
          --st-ok-bg:#e9f6ec; --st-ok-ink:#22572c; --st-warn-bg:#fff4e5;
          --st-warn-ink:#9a3412; --line-strong:#b6bcc7; }
  body.dark { --accent:#f0632f; --line:#3a414b; --muted:#9aa1ab; --bg:#17191d;
              --ink:#e8eaed; --panel:#1f2328; --input-bg:#262b31; --hover:#262b31;
              --active-bg:#3a2418; --badge-bg:#2a2f36; --badge-warn-bg:#3d2a14;
              --badge-warn-ink:#f0a35e; --dot:#4a515c; --del-ink:#ff8a8a;
              --del-bg:#4a2020; --dirty-bg:#3a341c; --ok:#7ec98f; --err:#ff8a8a;
              --st-ok-bg:#1f3a26; --st-ok-ink:#7ec98f; --st-warn-bg:#3d2a14;
              --st-warn-ink:#f0a35e; --line-strong:#4a525e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:flex; height:100vh; overflow:hidden; }
  button { padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:var(--panel);
           color:var(--ink); cursor:pointer; font:inherit; }
  button:hover { border-color:var(--line-strong); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  input { font:inherit; color:var(--ink); }

  /* ---------- sidebar ---------- */
  nav { flex:0 0 auto; background:var(--panel); border-right:1px solid var(--line);
        display:flex; flex-direction:column; }
  .brand { padding:16px 18px 12px; font-weight:700; font-size:15px; }
  .brand small { display:block; color:var(--muted); font-weight:400; font-size:11px; }
  .navlabel { padding:8px 18px 4px; font-size:11px; letter-spacing:.08em; color:var(--muted); }
  ul#tenderList { list-style:none; margin:0; padding:0; overflow-y:auto;
                  flex:1 1 auto; min-height:0; }
  ul#tenderList li { display:flex; align-items:center; gap:8px; padding:8px 12px 8px 18px;
                     cursor:pointer; border-left:3px solid transparent; }
  ul#tenderList li:hover { background:var(--hover); }
  ul#tenderList li.active { background:var(--active-bg); border-left-color:var(--accent); }
  ul#tenderList .tname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dot); flex:0 0 8px; }
  .dot.calculated { background:#3d9a50; }
  .dot.pdf_stored { background:#4a7fc1; }
  .del { border:0; background:none; color:var(--muted); padding:2px 6px; border-radius:6px; }
  .del:hover { color:var(--del-ink); background:var(--del-bg); }
  .addbox { padding:12px 14px; border-top:1px solid var(--line); flex:0 0 auto; }
  .navlink { display:block; width:100%; margin-top:8px; padding:6px 4px;
             background:none; border:0; color:var(--muted); text-align:left;
             cursor:pointer; font:inherit; }
  .navlink:hover { color:var(--ink); background:none; border:0; }
  #addForm { display:flex; gap:6px; margin-bottom:8px; }
  #addForm input { flex:1; min-width:0; padding:6px 8px; border:1px solid var(--line);
                   border-radius:8px; background:var(--input-bg); color:var(--ink); }
  #renameInput { font-size:15px; font-weight:650; padding:4px 8px;
                 border:1px solid var(--accent); border-radius:8px; width:300px;
                 background:var(--input-bg); color:var(--ink); }
  .hidden { display:none !important; }
  nav { width:240px; overflow:hidden; transition:width .18s ease; }
  body.navoff nav { width:0; border-right-color:transparent; }
  .nav-inner { width:240px; }
  .navtoggle { position:absolute; left:240px; top:50%; transform:translateY(-50%);
               z-index:40; width:16px; height:46px; padding:0;
               border:1px solid var(--line); border-left:0;
               border-radius:0 8px 8px 0; background:var(--panel); color:var(--muted);
               display:flex; align-items:center; justify-content:center;
               font-size:15px; line-height:1; transition:left .18s ease;
               box-shadow:2px 0 8px rgba(0,0,0,.06); }
  .navtoggle:hover { color:var(--ink); }
  body.navoff .navtoggle { left:0; }
  .navtoggle .arr-r { display:none; }
  body.navoff .navtoggle .arr-l { display:none; }
  body.navoff .navtoggle .arr-r { display:block; }
  .switch { position:relative; display:inline-block; width:44px; height:24px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .slider { position:absolute; inset:0; background:var(--line-strong);
                    border-radius:999px; cursor:pointer; transition:background .15s; }
  .switch .slider::before { content:""; position:absolute; width:18px; height:18px;
                            left:3px; top:3px; background:#fff; border-radius:50%;
                            transition:transform .15s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider::before { transform:translateX(20px); }

  /* ---------- main (topbar pinned, view panel scrolls) ---------- */
  main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
            padding:12px 24px; background:var(--panel); border-bottom:1px solid var(--line);
            flex:0 0 auto; }
  .views { flex:1 1 auto; min-height:0; overflow-y:auto;
           display:flex; flex-direction:column; }
  .topbar h1 { font-size:16px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  .dl { color:var(--accent); text-decoration:none; font-weight:600; }
  .dl:hover { text-decoration:underline; }
  .dlwrap { position:relative; }
  .dlmenu { position:absolute; right:0; top:calc(100% + 4px); background:var(--panel);
            border:1px solid var(--line); border-radius:10px; min-width:120px;
            box-shadow:0 8px 28px rgba(0,0,0,.14); z-index:30; overflow:hidden; }
  .dlmenu a { display:block; padding:9px 16px; cursor:pointer; font-size:13.5px; }
  .dlmenu a:hover { background:var(--active-bg); }
  .dl-opt { display:flex; gap:8px; align-items:center; padding:8px 16px;
            font-size:12.5px; color:var(--muted); cursor:pointer; }
  .dl-sep { height:1px; background:var(--line); margin:3px 0; }
  .spacer { flex:1; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
           background:var(--badge-bg); }
  .badge.warn { background:var(--badge-warn-bg); color:var(--badge-warn-ink); }
  .content { max-width:1150px; width:100%; margin:20px auto; padding:0 20px;
             display:grid; gap:16px; flex:0 0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 20px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em;
             color:var(--muted); margin:0 0 12px; }
  .scenario { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .sc-margin { flex:1 1 320px; min-width:260px; }
  .sc-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .sc-label { font-size:12px; color:var(--muted); }
  .sc-value { font-size:21px; font-weight:700; color:var(--accent);
              font-variant-numeric:tabular-nums; }
  .sc-value small { font-size:12px; font-weight:600; margin-left:1px; }
  .sc-margin input[type=range] { width:100%; accent-color:var(--accent); }
  .sc-track { position:relative; height:12px; margin-top:3px; }
  .sc-end { position:absolute; top:0; font-size:10.5px; color:var(--muted); }
  .sc-dot { position:absolute; top:2px; width:7px; height:7px; border-radius:50%;
            transform:translateX(-50%); background:var(--mk); }
  .sc-legend { display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .sc-chip { display:flex; align-items:center; gap:6px; padding:5px 11px;
             border:1px solid var(--line); border-radius:999px; background:var(--panel);
             font:inherit; }
  .sc-chip:hover { border-color:var(--line-strong); }
  .sc-chip.on { background:var(--active-bg); border-color:transparent; }
  .sc-chip i { width:8px; height:8px; border-radius:50%; background:var(--mk); }
  .sc-chip b { font-size:11.5px; font-weight:650; color:var(--mk); }
  .sc-chip span { font-size:11px; color:var(--muted); }
  .mk-agg { --mk:var(--st-ok-ink); }
  .mk-tgt { --mk:var(--accent); }
  .mk-con { --mk:#4a7fc1; }
  .sc-right { display:flex; align-items:baseline; gap:12px; }
  .sc-win { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .sc-divider { width:1px; align-self:stretch; background:var(--line); }
  .sc-inputs { display:flex; gap:16px; flex-wrap:wrap; }
  .sc-inputs > * > span { display:block; font-size:12px; color:var(--muted);
                              margin-bottom:6px; }
  .sc-field { display:flex; align-items:center; border:1px solid var(--line);
              border-radius:8px; background:var(--input-bg); }
  .sc-field:focus-within { border-color:var(--accent); }
  .sc-field input { width:74px; padding:7px 2px 7px 10px; border:0; background:transparent;
                    text-align:right; appearance:textfield; }
  .sc-field input::-webkit-outer-spin-button,
  .sc-field input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .sc-field input:focus { outline:none; }
  .sc-field i { font-style:normal; color:var(--muted); padding-right:10px; }
  a.sc-mode, a.sc-mode:visited { color:var(--ink); text-decoration:none; padding:7px 10px;
                                justify-content:space-between; gap:24px; min-width:128px; }
  a.sc-mode:hover { border-color:var(--accent); background:var(--hover); }
  .sc-mode > span[aria-hidden] { color:var(--muted); font-size:18px; line-height:1; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .stat .k { font-size:12px; color:var(--muted); }
  .stat .v { font-size:19px; font-weight:650; margin-top:3px; font-variant-numeric:tabular-nums; }
  .stat.hl { border-color:var(--accent); }
  .stat.hl .v { color:var(--accent); }
  #uploadMsg { font-size:13px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:8px;
           background:var(--panel); color:var(--ink); font:inherit; max-width:100%; }
  .setrow { display:grid; grid-template-columns:220px 1fr; gap:12px; align-items:center;
            padding:12px 0; border-bottom:1px solid var(--line); }
  .setrow:last-child { border-bottom:0; }
  .setrow select { max-width:240px; }
  .pf-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:4px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg-btn { border:0; border-radius:0; padding:6px 16px; background:var(--panel);
             color:var(--muted); cursor:pointer; font:inherit; }
  .seg-btn.on { background:var(--accent); color:#fff; }
  .pf-field { display:flex; align-items:center; gap:12px; }
  .pf-field input { width:82px; padding:6px 8px; border:1px solid var(--line);
                    border-radius:8px; background:var(--input-bg); color:var(--ink); }
  .pf-eff { font-size:12px; color:var(--muted); min-width:96px; }
  details.adv { border:1px solid var(--line); border-radius:10px; padding:10px 16px;
                background:var(--panel); }
  details.adv summary { cursor:pointer; font-weight:600; color:var(--muted);
                        font-size:13px; }

  /* ---------- big empty-state upload zone ---------- */
  .emptywrap { display:flex; align-items:center; justify-content:center;
               flex:1 1 auto; padding:24px; }
  .uploadzone { text-align:center; border:2px dashed var(--line-strong); border-radius:16px;
                padding:70px 80px; background:var(--panel); }
  .uploadzone.drag { border-color:var(--accent); background:var(--active-bg); }
  .uploadzone .big { font-size:44px; line-height:1; margin-bottom:14px; }
  .uploadzone h2 { margin:0 0 6px; font-size:20px; }
  .uploadzone p { color:var(--muted); margin:0 0 24px; }
  .bigbtn { display:inline-block; background:var(--accent); color:#fff; font-size:17px;
            font-weight:650; padding:16px 42px; border-radius:12px; cursor:pointer;
            border:1px solid var(--accent); }
  .bigbtn:hover { filter:brightness(1.05); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:5px 6px; text-align:right; border-bottom:1px solid var(--line);
           white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  th[data-key] { cursor:pointer; user-select:none; }
  th[data-key]:hover { color:var(--ink); }
  th .arrow { font-size:10px; margin-left:2px; }
  th:first-child, td:first-child { text-align:left; }
  td.num, th.num { font-variant-numeric:tabular-nums; }
  tr:hover td { background:var(--hover); }
  tr.dirty td { background:var(--dirty-bg); }
  .st { padding:1px 8px; border-radius:999px; font-size:11px; background:var(--st-ok-bg); color:var(--st-ok-ink); }
  .st.warn { background:var(--st-warn-bg); color:var(--st-warn-ink); }
  td input[type=number] { width:100%; min-width:70px; padding:3px 1px;
                          border:1px solid transparent; border-radius:6px;
                          background:transparent; text-align:right;
                          font-variant-numeric:tabular-nums; appearance:textfield; }
  td input[type=number]::-webkit-outer-spin-button,
  td input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  td input[type=number]:hover { border-color:var(--line); background:var(--panel); }
  td input[type=number]:focus { border-color:var(--accent); background:var(--panel); outline:none; }
  .computed { color:var(--ink); }
  .welcome { flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
             justify-content:center; text-align:center; color:var(--muted);
             padding:80px 20px; }
  .welcome b { color:var(--ink); }
</style>

<link rel="stylesheet" href="/static/workspace.css">

<nav>
  <div class="nav-inner">

  <div class="navlabel">TENDERS</div>
  <ul id="tenderList"></ul>
  <div class="addbox">
    <div id="addForm" class="hidden">

        </label>
        <label class="dl-opt" title="leave the supplier-quotations notice out of the exported offer">

<script>
const $ = id => document.getElementById(id);

function setDarkMode(on) {
  document.body.classList.toggle("dark", on);
  localStorage.setItem("autotender_dark", on ? "1" : "0");
}
if (localStorage.getItem("autotender_dark") === "1") document.body.classList.add("dark");
if (localStorage.getItem("autotender_nav") === "1") document.body.classList.add("navoff");
let tenders = [], current = localStorage.getItem("autotender_current");
let meta = null, calc = null, params = null;
let dirtyFields = new Map();           // lv_id -> Set of edited field names
const tenderDrafts = new Map();        // Preserve in-session edits when visiting training/settings.
let sortState = { key: null, dir: 1 }; // column key + 1 asc / -1 desc
let view = "tender";                   // "tender" | "settings" | "training"
let pfMode = "manual";                // productivity factors mode
let pfProd = null;                    // productivity settings being edited

function collectPf() {
  if (!pfProd) return;
  const out = { ...(pfProd[pfMode] || {}) };
  document.querySelectorAll(".pf-val").forEach(inp => {
    const v = parseFloat(inp.value);
    if (!isNaN(v)) out[inp.dataset.k] = v;
  });
  pfProd[pfMode] = out;
}
let SCENARIOS = [];
let winAnchors = [];
let predictionTimer = null, predictionRequest = 0, predictionKey = null;
function winChance(margin) {
  const a = winAnchors;
  if (!a.length) return "unavailable";
  if (margin <= a[0][0]) return Math.round(a[0][1]);
  if (margin >= a[a.length - 1][0]) return Math.round(a[a.length - 1][1]);
  for (let i = 0; i < a.length - 1; i++) {
    const [x1, y1] = a[i], [x2, y2] = a[i + 1];
    if (margin >= x1 && margin <= x2)
      return Math.round(y1 + (y2 - y1) * (margin - x1) / (x2 - x1));
  }
  return "unavailable";
}
function winLabel(margin) {
  const chance = winChance(margin);
  return typeof chance === "number" ? `≈ ${chance}% win chance` : "Win estimate unavailable";
}
function usePrediction(data) {
  winAnchors = (data?.curve || []).map(p => [p.margin_pct, p.p_win.mid * 100]);
  if ($("winOut")) $("winOut").textContent = winLabel(parseFloat($("margin").value));

}
function refreshPrediction(baseline) {
  const key = `${current}:${baseline}`;
  if (key === predictionKey) return;
  predictionKey = key;
  clearTimeout(predictionTimer);
  const request = ++predictionRequest, tender = current;
  winAnchors = [];
  if ($("winOut")) $("winOut").textContent = "Updating win estimate…";
  predictionTimer = setTimeout(async () => {
    try {
      const res = await fetch(`/api/tenders/${tender}/wincurve?baseline=${encodeURIComponent(baseline)}`);
      if (!res.ok) throw new Error("prediction unavailable");
      const data = await res.json();
      if (request === predictionRequest && current === tender) usePrediction(data);
    } catch (e) {
      if (request === predictionRequest && current === tender) { predictionKey = null; usePrediction(null); }
    }
  }, 180);
}
let uiSettings = null;

const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const chf = x => x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ------------------------------------------------ table sorting */

const COLS = { lv:0, product:1, code:2, quantity:3, unit:4, net:5, material:6, hours:7, labour:8, direct:9, status:10 };

// sort keys read the LIVE cells, so an edited quantity/labour sorts correctly
function sortValue(tr, key) {
  const cell = tr.children[COLS[key]];
  if (key === "quantity" || key === "net" || key === "labour")
    return parseFloat(cell.querySelector("input").value) || 0;
  if (key === "material" || key === "direct" || key === "hours")
    return parseFloat(cell.textContent.replace(/,/g, "")) || 0;
  return cell.textContent.trim().toLowerCase();
}

function applySort() {
  if (!sortState.key) return;
  const tb = $("posTable").querySelector("tbody");
  [...tb.children]
    .sort((a, b) => {
      const va = sortValue(a, sortState.key), vb = sortValue(b, sortState.key);
      const cmp = typeof va === "number" ? va - vb : va.localeCompare(vb);
      return (cmp || a.dataset.lv.localeCompare(b.dataset.lv)) * sortState.dir;
    })
    .forEach(tr => tb.appendChild(tr));   // moving nodes keeps edits + listeners
  $("posTable").querySelectorAll("th[data-key]").forEach(th => {
    th.querySelector(".arrow").textContent = th.dataset.key === sortState.key
      ? (sortState.dir > 0 ? "\u25B2" : "\u25BC") : "";
  });
}

async function refreshTenders(selectId) {
  tenders = await (await fetch("/api/tenders")).json();
  if (selectId) current = selectId;
  else if (!current || !tenders.some(t => t.id === current)) current = tenders[0]?.id ?? null;
  renderSidebar();
  await loadTender();
}

function renderSidebar() {
  $("tenderList").innerHTML = tenders.map(t =>
    `<li data-id="${t.id}" class="${t.id === current ? "active" : ""}" title="${esc(t.name)}">
       <span class="dot ${t.status}" aria-hidden="true"></span>
       <span class="tname">${esc(t.name)}</span>${t.lifecycle === "finalised" ? `<span class="tstate">${({won:"Won",lost:"Lost",withdrawn:"Withdrawn"})[t.status] || "Finalised"}</span>` : ""}
       <button class="del" data-del="${t.id}" title="delete tender">&#10005;</button>
     </li>`).join("");
}

async function loadTender() {
  meta = calc = null;
  view = "tender";   // selecting/refreshing tenders always returns to that view
  if (!current) { localStorage.removeItem("autotender_current"); renderMain(); return; }
  const tender = current;
  localStorage.setItem("autotender_current", tender);
  const res = await fetch(`/api/tenders/${tender}`);
  const j = await res.json();
  if (current !== tender || view !== "tender") return;
  if (!res.ok) { current = null; renderSidebar(); renderMain(); return; }
  meta = j.meta; calc = j.calc; params = j.params;
  dirtyFields = new Map();
  renderMain();
}

function stashTenderDraft() {
  if (view !== "tender" || !current || !$("posTable")) return;
  tenderDrafts.set(current, {
    fields: new Map([...dirtyFields].map(([lv, fields]) => [lv, new Set(fields)])),

}

/* live recompute - mirrors step4_project.py and the PDF report; labour comes
   from the (possibly edited) labour input, hours stays as loaded */
function recompute() {
  if (!calc) return;
  const waste = parseFloat($("waste").value) || 0;
  const overhead = parseFloat($("overhead").value) || 0;
  const margin = parseFloat($("margin").value) || 0;
  $("marginOut").value = margin;
  if ($("winOut")) $("winOut").textContent = winLabel(margin);
  document.querySelectorAll(".sc-chip").forEach(chip =>
    chip.classList.toggle("on", Math.abs(parseFloat(chip.dataset.margin) - margin) < 0.26));

  let material = 0, labour = 0, supplierMat = 0;
  document.querySelectorAll("#posTable tbody tr").forEach(tr => {
    const pos = calc.position_results.find(p => p.lv_id === tr.dataset.lv);
    const qty = parseFloat(tr.querySelector('[data-f="quantity"]').value) || 0;
    const net = parseFloat(tr.querySelector('[data-f="net_unit_cost_chf"]').value) || 0;
    const lab = parseFloat(tr.querySelector('[data-f="labour_cost_chf"]').value) || 0;
    const mat = r2(qty * net * (1 + waste / 100));
    tr.querySelector(".c-mat").textContent = chf(mat);
    tr.querySelector(".c-dir").textContent = chf(r2(mat + lab));
    material += mat; labour += lab;
    if (pos.price_source === "supplier_package") supplierMat += mat;
  });
  const direct = r2(material + labour);
  const services = calc.project_cost?.services_chf?.total_chf ?? 0;
  const a = params.allowances;
  const allowances = r2(material * a.small_material_pct / 100
                      + supplierMat * a.supplier_package_contingency_pct / 100
                      + direct * a.transport_equipment_pct / 100);
  const baseline = r2(r2(direct + services + allowances) * (1 + overhead / 100));
  const price = r2(baseline / (1 - margin / 100));

  $("cMat").textContent = chf(r2(material));
  $("cLab").textContent = chf(r2(labour));
  $("cDir").textContent = chf(direct);
  $("cBase").textContent = chf(baseline);
  $("cPrice").textContent = chf(price);
  refreshPrediction(baseline);
}

async function setupFeedback() {
  const tender = current, panel = $("feedbackPanel");
  panel.querySelectorAll("input, select, textarea, button").forEach(el => el.disabled = true);
  const active = () => current === tender && panel.isConnected;
  let data = null, reasonChanged = false;
  const localDate = value => { const d = new Date(value); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,19); };
  const showMessage = (text, error=false) => { if (!active()) return; $("feedbackMessage").textContent=text; $("feedbackMessage").classList.toggle("err",error); };
  async function request(action, body) {
    const res = await fetch(`/api/tenders/${tender}/${action}`, body === undefined ? {} : {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || "Could not save. Please try again.");
    return result;
  }
  function showDocuments(documents) {
    if (!active()) return;
    $("outcomeDocuments").innerHTML=documents.map(d=>`<a href="/api/tenders/${tender}/completion-documents/${d.id}" download>${esc(d.name)} <small>${Math.max(1,Math.round(d.size/1024))} KB ↓</small></a>`).join("");
  }
  function showSubmission() {
    const frozen=!!data.submission;
    $("submittedOfferField").classList.toggle("hidden",frozen || !data.offers?.length);
    $("submittedOffer").disabled=frozen;
    $("feedbackBid").readOnly=!!$("submittedOffer").value;
    $("submissionFields").classList.toggle("hidden",frozen);
    ["feedbackBid","feedbackSubmitted"].forEach(id=>{ $(id).required=!frozen; $(id).disabled=frozen; });
  }
  try {
    const [feedback, files] = await Promise.all([request("feedback"),request("completion-documents")]);
    if(!active()) return;
    data=feedback; showDocuments(files.documents);
    $("submittedOffer").innerHTML='<option value="">Other offer · enter the price below</option>'+data.offers.map(o=>`<option value="${esc(o.id)}">${esc(new Date(o.captured_at).toLocaleString())} · CHF ${chf(o.bid_amount_chf)}</option>`).join("");
    $("submittedOffer").onchange=()=>{
      const offer=data.offers.find(o=>o.id===$("submittedOffer").value);
      if(offer)$("feedbackBid").value=offer.bid_amount_chf;
      $("feedbackSubmitted").min=offer ? localDate(new Date(new Date(offer.captured_at).getTime()+1000)) : "";
      showSubmission();
    };
    showSubmission();
    showMeasurement();
    showEvidence();
    $("feedbackBid").value=meta.final_commercial ? Number($("cPrice").textContent.replaceAll(",","")) : "";
    $("feedbackObserved").value=localDate(data.outcome?.observed_at || new Date());
    if(data.outcome) {
      const out=data.outcome;
      $("feedbackOutcome").value=out.outcome;
      $("feedbackNarrative").value=out.narrative||"";
      $("feedbackEvidence").value=out.evidence_reference||"";
      $("feedbackVerified").checked=out.verified;
      $("feedbackReason").value=out.reason_codes?.[0]||"";
      $("feedbackReasonsConfirmed").checked=out.reasons_confirmed;
      $("feedbackWinner").value=out.winner||"";
      $("feedbackAward").value=out.award_price_chf||"";
      $("feedbackComparable").checked=out.award_price_comparable;
      $("feedbackState").textContent=`${({won:"Won",lost:"Lost",withdrawn:"Withdrawn"})[out.outcome]} · You can update the result or add documents.`;
      $("feedbackActions").innerHTML=`<a href="/api/tenders/${tender}/postmortem?format=pdf">Download report ↓</a>`;
    }
  } catch(error) { showMessage(error.message,true); }
  if (!active()) return;
  $("feedbackReason").onchange=()=>{reasonChanged=true;};
  $("uploadOutcomeDocuments").onclick=()=>$("outcomeFiles").click();
  $("outcomeFiles").onchange=async event=>{
    const input=event.target, files=[...input.files];input.disabled=true;
    try {
      for(const file of files) {
        const res=await fetch(`/api/tenders/${tender}/completion-documents?name=${encodeURIComponent(file.name)}`,{method:"POST",body:file});
        const result=await res.json();if(!res.ok)throw new Error(result.error);
        showDocuments(result.documents);
        if(active()&&!$("feedbackEvidence").value)$("feedbackEvidence").value=`Uploaded document: ${result.document.name}`;
      }
      showMessage(`${files.length} document${files.length===1?"":"s"} uploaded.`);
    } catch(error){showMessage(error.message,true);} finally{input.disabled=false;input.value="";}
  };
  $("outcomeForm").onsubmit=async event=>{
    event.preventDefault();const button=$("recordOutcome");button.disabled=true;
    try {
      if(!data)throw new Error("Reload the tender to load its outcome history.");
      const observed=new Date($("feedbackObserved").value).toISOString();
      const submitted=data.submission?.submitted_at || new Date($("feedbackSubmitted").value).toISOString();
      if(new Date(observed)<=new Date(submitted))throw new Error("The result must be received after the bid was submitted.");
      const evidence=$("feedbackEvidence").value;
      if(($("feedbackVerified").checked||$("feedbackReasonsConfirmed").checked)&&!evidence.trim())throw new Error("Add a supporting document or evidence reference.");
      const body={expected_revision:data.outcome?.revision||0,outcome:$("feedbackOutcome").value,observed_at:observed,
        narrative:$("feedbackNarrative").value,verified:$("feedbackVerified").checked,evidence_reference:evidence,
        reason_codes:reasonChanged ? [$("feedbackReason").value].filter(Boolean) : (data.outcome?.reason_codes||[$("feedbackReason").value].filter(Boolean)),
        reasons_confirmed:$("feedbackReasonsConfirmed").checked,winner:$("feedbackWinner").value,
        competitors:data.outcome?.competitors||[],award_price_chf:$("feedbackAward").value ? Number($("feedbackAward").value) : null,
        award_price_comparable:$("feedbackComparable").checked};
      if(!data.submission) {
        const saved=await request("submission",{offer_id:$("submittedOffer").value||undefined,submitted_at:submitted,bid_amount_chf:Number($("feedbackBid").value),retrospective:true});
        data=saved.feedback;if(active())showSubmission();
      }
      const saved=await request("outcome",body);data=saved.feedback;
      if(!active())return;
      meta.status=body.outcome;
      $("feedbackState").textContent=`${({won:"Won",lost:"Lost",withdrawn:"Withdrawn"})[body.outcome]} · Result saved.`;
      $("feedbackActions").innerHTML=`<a href="/api/tenders/${tender}/postmortem?format=pdf">Download report ↓</a>`;
      showMessage("Outcome saved.");
      tenders=await (await fetch("/api/tenders")).json();renderSidebar();
    } catch(error){showMessage(error.message,true);} finally{button.disabled=false;}
  };
  $("gatherOutcomeEvidence").onclick=async event=>{
    const button=event.target, status=$("publicEvidenceStatus");button.disabled=true;status.textContent="Importing notice…";
    try {const result=await request("gather-evidence",{urls:[$("feedbackLinks").value.trim()].filter(Boolean)});
      data=result.feedback;if(active()){showEvidence();if(result.result.errors?.length)status.textContent+=" Some notices could not be imported. Check the project URL.";}
    }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
  };
  $("measurementForm").onsubmit=async event=>{
    event.preventDefault();const button=$("recordMeasurement"), status=$("measurementMessage");button.disabled=true;
    try {const target=Object.fromEntries([...panel.querySelectorAll('[data-measure]')].filter(el=>el.value!=="").map(el=>[el.dataset.measure,Number(el.value)]));
      if(!Object.keys(target).length)throw new Error("Enter at least one measured factor.");
      const saved=await request("productivity-feedback",{target,expected_revision:data.productivity?.revision||0,verified:$("measurementVerified").checked,measurement_reference:$("measurementReference").value,input:data.productivity?.input||{project_type:calc.project?.name||"ventilation"}});
      data=saved.feedback;if(active()){showMeasurement();status.textContent="Measurement saved.";}
    }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
  };
  $("revokeMeasurement").onclick=async event=>{
    const button=event.target;button.disabled=true;
    try {const saved=await request("revoke-productivity",{expected_revision:data.productivity?.revision||0});
      data=saved.feedback;if(active()){showMeasurement();$("measurementMessage").textContent="Measurement excluded from learning.";}
    }catch(error){if(active())$("measurementMessage").textContent=error.message;}finally{button.disabled=false;}
  };
  function showMeasurement(){
    const measurement=data.productivity;
    panel.querySelectorAll('[data-measure]').forEach(el=>el.value=measurement?.target?.[el.dataset.measure]??"");
    $("measurementReference").value=measurement?.measurement_reference||"";
    $("measurementVerified").checked=!!measurement && measurement.verified!==false;
    $("revokeMeasurement").classList.toggle("hidden",!measurement||measurement.verified===false);
    $("measurementMessage").textContent=measurement ? (measurement.verified===false ? "Excluded from learning." : "Measurement saved.") : "";
  }
  function showEvidence(){
    const evidence=data.evidence;
    $("publicEvidenceStatus").textContent=evidence?.records?.length ? `${evidence.records.length} notice(s) saved.` : "";
    $("feedbackLinks").value=evidence?.urls?.[0]||"";
  }
  $("reopenBtn").onclick=async()=>{
    try {await request("reopen",{});tenderDrafts.delete(tender);if(active())await loadTender();}
    catch(error){showMessage(error.message,true);}
  };
  if (data) {
    panel.querySelectorAll("input, select, textarea, button").forEach(el => el.disabled = false);
    showSubmission();
  }
  $("reopenBtn").disabled=false;
}

/* ------------------------------------------------ settings (models) */

const TASKS = [
  { key: "input_processing", label: "Input processing" },
  { key: "productivity_factors", label: "Productivity factors" },
  { key: "win_ratio", label: "Win-ratio prediction" },
  { key: "market_extraction", label: "Public notice extraction" },
];

async function loadSettings() {
  uiSettings = await (await fetch("/api/settings")).json();
  if (view === "settings") renderSettings();
}

function renderSettings() {
  $("emptywrap").classList.add("hidden");
  $("welcome").classList.add("hidden");
  $("content").classList.remove("hidden");
  ["saveBtn", "dlwrap", "finaliseBtn", "lifecycleBadge", "tenderActionMsg"].forEach(id => $(id).classList.add("hidden"));
  $("dlMenu").classList.add("hidden");
  $("renameBtn").classList.add("hidden");
  $("dirtyBadge").classList.add("hidden");
  $("reviewBadge").classList.add("hidden");
  $("tenderTitle").textContent = "Settings";
  $("sub").textContent = "";
  if (!uiSettings) { loadSettings(); return; }

  $("content").innerHTML = `
    <section class="card">
      <h2>Productivity factors</h2>
      <div class="pf-head">
        <div class="seg" id="pfSeg">
          <button class="seg-btn" data-mode="manual">Manual</button>
          <button class="seg-btn" data-mode="ai">AI</button>
        </div>
        <span class="hint" id="pfNote"></span>
      </div>
      <div id="pfRows"></div>
    </section>
    <section class="card">
      <h2>Appearance</h2>
      <div class="setrow">
        <b>Dark mode</b>
        <label class="switch"><input type="checkbox" id="darkToggle" aria-label="Dark mode"><span class="slider"></span></label>
      </div>
    </section>
    <div class="upload-row">
      <button id="saveSettingsBtn" class="primary">Save</button>
      <span id="settingsMsg" class="hint"></span>
    </div>`;

  $("darkToggle").checked = document.body.classList.contains("dark");
  $("darkToggle").addEventListener("change", e => setDarkMode(e.target.checked));

  // productivity factors: manual values or AI suggestions, both editable
  const prod = uiSettings.productivity || { mode: "manual", manual: {}, ai: {} };
  pfMode = prod.mode;
  const FLD = { site_efficiency: "site efficiency", school_logistics: "school logistics",
                mounting_height_school: "mounting height - school",
                mounting_height_sports_hall: "mounting height - sports hall",
                timber_interface: "timber interface" };
  const effTxt = (k, v) => {
    const pct = (k === "site_efficiency" ? 1 / v - 1 : v - 1) * 100;
    return `= ${pct >= 0 ? "+" : ""}${pct.toFixed(1)}% hours`;
  };
  $("pfRows").innerHTML = Object.keys(FLD).map(k => `
    <div class="setrow">
      <b>${FLD[k]}</b>
      <div class="pf-field">
        <input type="number" class="pf-val" data-k="${k}" aria-label="${FLD[k]}" step="0.01" min="0.1" max="3">
        <span class="pf-eff" id="eff-${k}"></span>
      </div>
    </div>`).join("");
  pfProd = prod;
  const fillPf = () => {
    const vals = prod[pfMode] || {};
    document.querySelectorAll(".pf-val").forEach(inp => {
      const k = inp.dataset.k;
      inp.value = vals[k] ?? "";
      const v = parseFloat(inp.value);
      const e = $("eff-" + k);
      if (e && !isNaN(v)) e.textContent = effTxt(k, v);
    });
    document.querySelectorAll(".seg-btn").forEach(b =>
      b.classList.toggle("on", b.dataset.mode === pfMode));
    $("pfNote").textContent = pfMode === "ai"
      ? "suggested by the assigned productivity LoRA (demo values until the backend connects) - change what you want"
      : "your values apply to every new calculation";
  };
  document.querySelectorAll(".pf-val").forEach(inp =>
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      const e = $("eff-" + inp.dataset.k);
      if (e && !isNaN(v)) e.textContent = effTxt(inp.dataset.k, v);
    }));
  document.querySelectorAll(".seg-btn").forEach(b =>
    b.addEventListener("click", () => {
      if (b.dataset.mode === pfMode) return;
      collectPf();   // keep edits of the mode we are leaving
      pfMode = b.dataset.mode;
      fillPf();
    }));
  fillPf();

  $("saveSettingsBtn").addEventListener("click", saveSettings);
}

async function saveSettings() {
  const tasks = {};
  TASKS.forEach(t => tasks[t.key] = {
    selected: uiSettings.tasks[t.key].selected || null,
    links: uiSettings.tasks[t.key].links || "",
  });
  collectPf();
  const res = await fetch("/api/settings", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      base_model: uiSettings.base_model,
      tasks,
      productivity: { mode: pfMode, manual: pfProd?.manual || {}, ai: pfProd?.ai || {} },
      advanced: uiSettings.advanced,
    }),
  });
  const j = await res.json();
  const msg = $("settingsMsg");
  msg.classList.remove("ok", "err");
  msg.classList.add(j.ok ? "ok" : "err");
  msg.textContent = j.ok ? "saved" : j.error;
  if (j.ok) {
    uiSettings = j.settings;
    localStorage.setItem("autotender_pf_mode", pfMode);
  }
}

$("trainingBtn").addEventListener("click", openTraining);

$("settingsBtn").addEventListener("click", openSettings);

$("navToggle").addEventListener("click", () => {
  const off = document.body.classList.toggle("navoff");
  localStorage.setItem("autotender_nav", off ? "1" : "0");
});

/* ------------------------------------------------ actions */

$("addBtn").addEventListener("click", () => {
  $("addForm").classList.remove("hidden");
  $("tenderName").value = "";
  $("tenderName").focus();
});
$("tenderName").addEventListener("keydown", e => { if (e.key === "Enter") $("createBtn").click(); });
$("createBtn").addEventListener("click", async () => {
  const res = await fetch("/api/tenders", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: $("tenderName").value }),
  });
  const j = await res.json();
  if (!res.ok) { alert(j.error); return; }
  $("addForm").classList.add("hidden");
  stashTenderDraft();
  history.replaceState(null, "", location.pathname);
  await refreshTenders(j.id);
});

$("tenderList").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    if (!confirm("Delete this tender?")) return;
    await fetch(`/api/tenders/${del.dataset.del}`, { method: "DELETE" });
    if (current === del.dataset.del) current = null;
    await refreshTenders();
    return;
  }
  const li = e.target.closest("li[data-id]");
  if (li && (li.dataset.id !== current || view !== "tender")) {
    stashTenderDraft();
    history.replaceState(null, "", location.pathname);
    current = li.dataset.id;
    renderSidebar();
    await loadTender();
  }
});

async function uploadFile(file) {
  $("uploadMsg").className = "";
  $("uploadMsg").textContent = `uploading ${file.name}…`;
  try {
    const res = await fetch(`/api/tenders/${current}/upload?name=${encodeURIComponent(file.name)}`,
                            { method: "POST", body: file });
    const j = await res.json();
    const msg = $("uploadMsg");
    msg.className = j.ok ? "ok" : "err";
    msg.textContent = j.ok ? j.message : j.error;
    if (j.ok) { await refreshTenders(current); }
  } catch (e) { $("uploadMsg").className = "err"; $("uploadMsg").textContent = e; }
}
$("bigFile").addEventListener("change", e => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
  e.target.value = "";
});
const zone = $("zone");
["dragover", "dragenter"].forEach(ev => zone.addEventListener(ev, e => {
  e.preventDefault(); zone.classList.add("drag");
}));
["dragleave", "drop"].forEach(ev => zone.addEventListener(ev, e => {
  e.preventDefault(); zone.classList.remove("drag");
}));
zone.addEventListener("drop", e => {
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});

function currentEdits() {
  const edits = {};
  for (const [lv, fields] of dirtyFields) {
    const tr = [...$("posTable").tBodies[0].rows].find(row => row.dataset.lv === lv);
    edits[lv] = Object.fromEntries([...fields].map(f => {
      const v = parseFloat(tr.querySelector(`[data-f="${f}"]`).value);
      return [f, isNaN(v) ? null : v];
    }));
  }
  return edits;
}

$("finaliseBtn").addEventListener("click", async () => {
  const button=$("finaliseBtn"), msg=$("tenderActionMsg"), tender=current;
  button.disabled=true;msg.classList.remove("hidden");msg.textContent="Saving tender…";
  try {
    const response=await fetch(`/api/tenders/${tender}/finalise`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({edits:currentEdits(),margin:Number($("margin").value),overhead:Number($("overhead").value),waste:Number($("waste").value)})});
    const data=await response.json();if(!response.ok)throw new Error(data.error);
    tenderDrafts.delete(tender);
    await refreshTenders(tender);
    $("feedbackPanel").scrollIntoView({block:"start"});
    $("feedbackOutcome").focus({preventScroll:true});
  }catch(error){msg.textContent=error.message;}finally{button.disabled=false;}
});

$("saveBtn").addEventListener("click", async () => {
  const tender=current, edits=currentEdits();
  stashTenderDraft();
  const res = await fetch(`/api/tenders/${tender}/values`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ edits }),
  });
  const j = await res.json();
  if (!res.ok) { alert(j.error); return; }
  const draft=tenderDrafts.get(tender);
  draft.fields.clear(); draft.values=[];
  if (current === tender && view === "tender") await loadTender();
});

/* rename the current tender: pencil next to the title, Enter/blur saves, Esc cancels */
let renaming = false;
$("renameBtn").addEventListener("click", () => {
  if (!meta || renaming) return;
  renaming = true;
  const inp = $("renameInput");
  $("tenderTitle").classList.add("hidden");
  inp.classList.remove("hidden");
  inp.value = meta.name;
  inp.focus();
  inp.select();
});
async function commitRename(save) {
  if (!renaming) return;
  renaming = false;
  const inp = $("renameInput"), h = $("tenderTitle");
  const name = inp.value.trim();
  inp.classList.add("hidden");
  h.classList.remove("hidden");
  if (!save || !name || name === meta.name) return;
  const res = await fetch(`/api/tenders/${current}/rename`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });
  const j = await res.json();
  if (!j.ok) { alert(j.error); return; }
  await refreshTenders(current);
}
$("renameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") commitRename(true);
  if (e.key === "Escape") commitRename(false);
});
$("renameInput").addEventListener("blur", () => commitRename(true));

$("pdfBtn").addEventListener("click", e => {
  e.stopPropagation();
  $("dlMenu").classList.toggle("hidden");
});
document.addEventListener("click", e => {
  if (!e.target.closest(".dlwrap")) $("dlMenu").classList.add("hidden");
});
$("dlMenu").addEventListener("click", async e => {
  const item=e.target.closest("a[data-fmt]");if(!item)return;
  e.preventDefault();$("dlMenu").classList.add("hidden");
  const tender=current, edits=currentEdits(), msg=$("tenderActionMsg"), button=$("pdfBtn");
  const commercial=Object.fromEntries(["margin","overhead","waste"].map(k=>[k,Number($(k).value)]));
  const query=new URLSearchParams({format:item.dataset.fmt,hide:$("hideParams").checked?"1":"0",hide_notes:$("hideNotes").checked?"1":"0"});
  button.disabled=true;msg.classList.remove("hidden");msg.textContent="Preparing offer…";
  try {
    const response=await fetch(`/api/tenders/${tender}/offers`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...commercial,edits})});
    const offer=await response.json();if(!response.ok)throw new Error(offer.error);
    query.set("offer",offer.id);
    const link=document.createElement("a");link.href=`/api/tenders/${tender}/pdf?${query}`;link.download="";
    document.body.append(link);link.click();link.remove();
    if(current===tender && view==="tender"){
      if(!tenderFinished() && Object.keys(edits).length && JSON.stringify(currentEdits())===JSON.stringify(edits)){
        stashTenderDraft();const draft=tenderDrafts.get(tender);draft.fields.clear();draft.values=[];
        await loadTender();
      }
      if(current===tender && view==="tender"){msg.classList.remove("hidden");msg.textContent="Offer saved and downloaded.";}
    }
  }catch(error){if(current===tender && view==="tender")msg.textContent=error.message;}finally{button.disabled=false;}
});

$("hideParams").checked = localStorage.getItem("autotender_hide_params") === "1";
$("hideParams").addEventListener("change", e =>
  localStorage.setItem("autotender_hide_params", e.target.checked ? "1" : "0"));
$("hideNotes").checked = localStorage.getItem("autotender_hide_notes") === "1";
$("hideNotes").addEventListener("change", e =>
  localStorage.setItem("autotender_hide_notes", e.target.checked ? "1" : "0"));

if (window.matchMedia("(max-width: 700px)").matches && localStorage.getItem("autotender_nav") === null) document.body.classList.add("navoff");
refreshTenders().then(() => {
  if (location.hash === "#training") openTraining();
  else if (location.hash === "#settings") { view = "settings"; renderMain(); }
});
</script>
